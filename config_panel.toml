[main.storage.AWS_S3_ENDPOINT_URL]
ask.en = "URL endpoint"
ask.fr = "Url du point de terminaison"
help = "AWS_S3_ENDPOINT_URL"
type = "url"
bind = "AWS_S3_ENDPOINT_URL:__INSTALL_DIR__/__APP__/.env"

